output_dir: D:/LMO-MOO-runs/ablations/lmo_geometry
experiment:
  seed: 2025
  seeds:
  - 2025
  - 2026
  - 2027
  epochs: 200
  average_last_epochs: 10
  checkpoint_interval: 1
  device: auto
  deterministic: true
  methods:
  - Alg1-L2
  - Alg1-Spectral
  - Alg1-Mixed
  - Alg4-L2
  - Alg4-Spectral
  - Alg4-Mixed
  datasets:
  - cityscapes
  - nyuv2
model:
  width: 1.0
data:
  cityscapes:
    root: D:/datasets/cityscapes
    batch_size: 8
    workers: 4
    pin_memory: true
    augmentation: false
  nyuv2:
    root: D:/datasets/nyuv2
    batch_size: 2
    workers: 4
    pin_memory: true
    augmentation: true
search_space:
  gamma:
  - 0.0001
  - 0.0002
  - 0.0005
  - 0.001
  weight_step:
  - 0.1
  - 0.5
  - 1.0
  rho:
  - 0.01
  - 0.05
  - 0.1
  - 0.5
  - 1.0
  radius:
  - 1.0
  - 5.0
  - 10.0
  momentum_alpha:
  - 0.1
  - 0.5
  - 0.9
methods:
  Alg1-L2:
    kind: alg1
    lmo: l2
    gamma: 0.0005
    eta: 0.5
    radius: 1.0
    momentum_alpha: null
    width_scaling: none
  Alg1-Spectral:
    kind: alg1
    lmo: spectral
    gamma: 0.0005
    eta: 0.5
    radius: 1.0
    momentum_alpha: null
    spectral_backend: newton_schulz
    ns_steps: 5
    width_scaling: scion
  Alg1-Mixed:
    kind: alg1
    lmo: mixed
    gamma: 0.0005
    eta: 0.5
    radius: 1.0
    momentum_alpha: null
    spectral_backend: newton_schulz
    ns_steps: 5
    width_scaling: scion
  Alg4-L2:
    kind: alg4
    lmo: l2
    gamma: 0.0005
    beta: 0.5
    rho: 0.5
    radius: 1.0
    momentum_alpha: null
    width_scaling: none
  Alg4-Spectral:
    kind: alg4
    lmo: spectral
    gamma: 0.0005
    beta: 0.5
    rho: 0.5
    radius: 1.0
    momentum_alpha: null
    spectral_backend: newton_schulz
    ns_steps: 5
    width_scaling: scion
  Alg4-Mixed:
    kind: alg4
    lmo: mixed
    gamma: 0.0005
    beta: 0.5
    rho: 0.5
    radius: 1.0
    momentum_alpha: null
    spectral_backend: newton_schulz
    ns_steps: 5
    width_scaling: scion
  LS:
    kind: ls
    gamma: 0.0005
  SI:
    kind: si
    gamma: 0.0005
  RLW:
    kind: rlw
    gamma: 0.0005
  DWA:
    kind: dwa
    gamma: 0.0005
    temperature: 2.0
    iteration_window: 25
  UW:
    kind: uw
    gamma: 0.0005
    weight_lr: 0.0005
  MGDA:
    kind: mgda
    gamma: 0.0005
  PCGrad:
    kind: pcgrad
    gamma: 0.0005
  GradDrop:
    kind: graddrop
    gamma: 0.0005
  CAGrad:
    kind: cagrad
    gamma: 0.0005
    c: 0.4
  MoCo:
    kind: moco
    gamma: 0.0005
    tracking_beta: 0.5
    weight_lr: 0.1
    rho: 0.0
    tracking_beta_sigma: 0.5
    weight_lr_sigma: 0.5
  MoDo:
    kind: modo
    gamma: 0.0005
    weight_lr: 0.001
    rho: 0.1
  Nash-MTL:
    kind: nash-mtl
    gamma: 0.0005
  FAMO:
    kind: famo
    gamma: 0.0005
    weight_lr: 0.025
    weight_decay: 1.0e-05
  MGDA-warm:
    kind: mgda-warm
    gamma: 0.0005
    beta: 0.5
    rho: 0.5
    warm_steps: 40
    warm_beta: 0.5
    by_dataset:
      cityscapes:
        gamma: 0.0005
      nyuv2:
        gamma: 0.0001
